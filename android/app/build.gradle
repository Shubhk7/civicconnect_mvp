plugins {
    id "com.android.application"
}

def loadBaseUrl() {
    def url = project.findProperty("civicconnect.baseUrl") ?: "https://kashnet.online"
    def localProperties = new Properties()
    def localFile = rootProject.file("local.properties")
    if (localFile.exists()) {
        localFile.withInputStream { localProperties.load(it) }
        if (localProperties.getProperty("civicconnect.baseUrl")) {
            url = localProperties.getProperty("civicconnect.baseUrl")
        }
    }
    return url.toString().replaceAll(/\/+$/, "")
}

android {
    namespace "com.civicconnect.android"
    compileSdk 35

    defaultConfig {
        applicationId "com.civicconnect.android"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "CIVICCONNECT_BASE_URL", "\"${loadBaseUrl()}\""
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "androidx.activity:activity:1.9.3"
}
