spring.application.name=civicconnect-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/civicconnect}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:civicconnect}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:civicconnect_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is managed by db/init.sql via Docker, not Hibernate — avoid ddl-auto
# overwriting the PostGIS-aware schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

server.port=8080

# Allow the frontend (Cloudflare Pages / local dev) to call this API
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
