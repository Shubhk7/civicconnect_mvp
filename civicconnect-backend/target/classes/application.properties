spring.application.name=civicconnect-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/civicconnect}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:civicconnect}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:civicconnect_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is managed by db/init.sql via Docker, not Hibernate — avoid ddl-auto
# overwriting the PostGIS-aware schema. Do NOT manually set
# hibernate.dialect here — modern Hibernate auto-detects PostGIS support
# from hibernate-spatial on the classpath, and manually naming the
# dialect class breaks on Hibernate 6.5+ (ClassNotFoundException).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

server.port=8080

# Allow the frontend (Cloudflare Pages / local dev / WordPress) to call this API
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000,https://kashnet.online,https://www.kashnet.online,https://civicconnect-mvp.pages.dev}

# AI service — reachable at this address from inside the Docker network
# (service name "ai-service" resolves automatically via docker-compose)
app.ai-service.base-url=${AI_SERVICE_URL:http://ai-service:8001}

# Where blurred photo uploads are stored, and the public base URL used to
# build the photoUrl returned to the citizen. In Docker, /app/uploads
# should be a mounted volume (see docker-compose.yml) so uploads survive
# container restarts. The public base URL must be the backend's public
# address — this is what gets embedded in photoUrl values, so it has to
# be reachable by anyone viewing a complaint, not just the container
# network.
app.uploads.dir=${UPLOADS_DIR:/app/uploads}
app.uploads.public-base-url=${UPLOADS_PUBLIC_BASE_URL:https://api.kashnet.online}

# How often the SLA auto-escalation job runs, in milliseconds. 300000 = 5 minutes.
app.sla.escalation-interval-ms=${SLA_ESCALATION_INTERVAL_MS:300000}

# JWT signing secret. Must be at least 256 bits (32+ chars) for HS256.
# The default below is fine for local/hackathon dev ONLY — override with
# a long random value via the JWT_SECRET env var before any real
# deployment. Do not reuse this default outside local development.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-deploying-32chars-min}
app.jwt.expiry-hours=${JWT_EXPIRY_HOURS:24}
