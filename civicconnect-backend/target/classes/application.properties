spring.application.name=civicconnect-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/civicconnect}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:civicconnect}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:civicconnect_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is managed by db/init.sql via Docker, not Hibernate — avoid ddl-auto
# overwriting the PostGIS-aware schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisPGDialect
spring.jpa.show-sql=false

server.port=8080

# Allow the frontend (Cloudflare Pages / local dev / WordPress) to call this API
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000,https://kashnet.online,https://www.kashnet.online}

# AI service — reachable at this address from inside the Docker network
# (service name "ai-service" resolves automatically via docker-compose)
app.ai-service.base-url=${AI_SERVICE_URL:http://ai-service:8001}

# JWT signing secret. Must be at least 256 bits (32+ chars) for HS256.
# The default below is fine for local/hackathon dev ONLY — override with
# a long random value via the JWT_SECRET env var before any real
# deployment. Do not reuse this default outside local development.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-deploying-32chars-min}
app.jwt.expiry-hours=${JWT_EXPIRY_HOURS:24}
